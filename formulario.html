<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/svg+xml" href="img/favicon.png">
    <title>myTravelWeb</title>
</head>
<body>

    <header> 
      <h1> Viaja sin limites </h1>
      <h2> La <strong> mejor </strong> web de viajes  </h2>
      <h3> Planea, vive y recuerda todos tus viajes</h3>
      <img src="img/logotipo.jpg" alt="Logotipo de mi sitio web">
      <nav>
        <!-- No quiero que se vea tipo tabla, sino en linea, uno detrás de otro-->
            <a href="blog.html" title= "Leer artículos del Blog">  -Blog  </a>
            <a href="galeria.html" title= "Ver fotos de la galeria ">-Galería  </a>
            <a href="tabla.html" title= "Consultar datos ">-Tabla  </a>
            <a href="formulario.html" title= "Rellena tu formulario">-Formulario  </a>
        


      </nav>

    </header>
    <!--Contenido-->
    <main>
      <form name="form-reserva" action="procesar.php" method="post">

        <fieldset>
            <legend> 1.Datos Personales</legend>
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Ana Santos">
            </div>
            <div>
                <label for="email">Correo electrónico:</label>
                 <input type="email" id="email" required placeholder="usuario@correo.com">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                 <input type="password" id="password" required minlength="6" placeholder="Minimo 6 digitos">
            </div>
            <div>
          <label for="fecha-nacimiento">Fecha de nacimiento:</label>
          <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
        </div>
      

            
        </fieldset>

        <fieldset>
            <legend>2.Detalles</legend>
            <div>
                <label for="destino"> Seleccione su destino</label>
                <select id="destino" name="destino " required>
                    <option value=" " > Elige una opción</option>
                    <option value=" asia" > Asia </option>
                    <option value=" europa" > Europa </option>
                    <option value=" America" > America </option>
                    <option value=" africa" > Africa </option>
                    <option value=" oceania" > Oceanía </option>
                </select>
            </div>
            <div>
          <label for="fecha-viaje">Fecha prevista de salida: *</label>
          <input type="date" id="fecha-viaje" name="fecha-viaje" required>
        </div>

        <div>
          <label for="num-viajeros">Número de viajeros (1 a 10):</label>
          <input type="number" id="num-viajeros" name="num-viajeros" min="1" max="10" step="1" value="1">
        </div>

        </fieldset>
        <fieldset>
          <legend>Tipo de asiento en vuelo:</legend>
          <label>
            <input type="radio" name="asiento" value="ventana" checked> Ventana
          </label>
          <label>
            <input type="radio" name="asiento" value="pasillo"> Pasillo
          </label>
          <label>
            <input type="radio" name="asiento" value="centro"> Centro
          </label>
        </fieldset>

        <fieldset>
        <legend>3. Documentación y Observaciones</legend>

        <div>
          <label for="pasaporte">Adjuntar copia del pasaporte (PDF o Imagen):</label>
          <input type="file" id="pasaporte" name="pasaporte" accept=".pdf,.jpg,.png">
        </div>

        <div>
          <label for="satisfaccion">Nivel de ilusión por el viaje (1 al 10):</label>
          <input type="range" id="satisfaccion" name="satisfaccion" min="1" max="10" step="1" value="8">
        </div>

        <div>
          <label for="comentarios">Peticiones o comentarios especiales:</label>
          <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escribe aquí tus necesidades alimentarias o de alojamiento..."></textarea>
        </div>
      </fieldset>
        <div>
            <button type="submit"> Enviar solicitud</button>
            <button type="reset"> Borrar</button>
        </div>
      </form>

    </main>

</body>
</html>
