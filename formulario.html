    <main>
      <form name="form-reserva" action="procesar.php" method="post">

        <fieldset>
            <legend> 1.Datos Personales</legend>
            <div>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Ana Santos">
            </div>
            <div>
                <label for="email">Correo electrónico:</label>
                 <input type="email" id="email" required placeholder="usuario@correo.com">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                 <input type="password" id="password" required minlength="6" placeholder="Minimo 6 digitos">
            </div>

            
        </fieldset>

        <fieldset>
            <legend>2.Detalles</legend>
            <div>
                <label for="destino"> Seleccione su destino</label>
                <select id="destino" name="destino " required>
                    <option value=" " > Elige una opción</option>
                    <option value=" asia" > Asia </option>
                    <option value=" europa" > Europa </option>
                    <option value=" America" > America </option>
                    <option value=" africa" > Africa </option>
                    <option value=" oceania" > Oceanía </option>
                </select>
            </div>
        </fieldset>
        <div>
            <button type="submit"> Enviar solicitud</button>
            <button type="reset"> Borrar</button>
        </div>
      </form>

    </main>
